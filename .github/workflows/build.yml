name: Build

on:
  pull_request:
    branches:
      - develop
      - 'feature/**'
  push:
    branches:
      - develop
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Instalar dependências
        working-directory: ./app
        run: npm ci

      - name: Build
        working-directory: ./app
        run: npm run build